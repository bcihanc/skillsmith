name: Release bundle
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository manifests
        run: python3 scripts/validate-skill-bundle.py --repo-only .
      - name: Build .skill bundle
        run: |
          mkdir -p /tmp/bundle/skillsmith
          cp SKILL.md /tmp/bundle/skillsmith/
          cp -r references scripts /tmp/bundle/skillsmith/
          python3 scripts/validate-skill-bundle.py /tmp/bundle/skillsmith --pack /tmp/bundle/skillsmith.skill
          # Same bundle, PyYAML forced absent: the fallback branch must pass what the parser passes
          python3 -c "import sys, runpy; sys.modules['yaml'] = None; sys.argv = ['validate-skill-bundle.py', '/tmp/bundle/skillsmith']; runpy.run_path('scripts/validate-skill-bundle.py', run_name='__main__')"
      - name: Attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" /tmp/bundle/skillsmith.skill --clobber --repo "$GITHUB_REPOSITORY"
